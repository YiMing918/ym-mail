name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ym-mail
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Prepare wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          cp wrangler.toml.example wrangler.toml
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" wrangler.toml
          grep -q "$D1_DATABASE_ID" wrangler.toml
      - name: Deploy (retry x3)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ok=0
          for i in 1 2 3; do
            if npx -y wrangler@4 deploy; then ok=1; break; fi
            echo "deploy attempt $i failed, retrying..."
            sleep 20
          done
          test "$ok" = "1"
      - name: Smoke check (read-only)
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' https://yxa.us.ci/api/bootstrap)
          echo "bootstrap http: $code"
          test "$code" = "200"
